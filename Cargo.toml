[workspace]
members = ["crates/core", "crates/relay", "app/src-tauri"]
# Phase 0 spikes are throwaway and must never become a build dependency of the
# shipped crates, so they stay outside the workspace and build on their own.
exclude = ["spikes"]
resolver = "2"

[workspace.package]
version = "0.0.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/erancihan/todo-app"

# Every load-bearing dependency is pinned to an exact version (`=x.y.z`).
# Phase 0 is a go/no-go gate: a silent minor bump can invalidate a spike result,
# so the versions a spike was proven against are the versions the workspace uses.
[workspace.dependencies]
# --- body CRDT (ADR-002: yrs, behind the BodyCrdt trait) ---
yrs = "=0.27.3"

# --- serialization / ids / errors ---
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
# Content-addressing for attachments. Pure Rust, no C, so it compiles for wasm32
# as-is — which matters, because the hash has to be computed identically on both
# hosts or the same bytes would get two names.
# Opens a URL in the OS default browser — the Tauri shell's half of "links in a
# body open externally". Chosen over tauri-plugin-opener because a plugin drags
# in an ACL entry, a JS package, and capability config to do what one command
# with this crate does.
open = "=5.4.2"
sha2 = "=0.10.9"
thiserror = "=2.0.19"
uuid = { version = "=1.24.0", features = ["v7"] }

# --- native-only storage (Tauri build; wasm uses sqlite-wasm + OPFS in JS) ---
# `bundled` compiles SQLite from source, so every platform in the matrix gets the
# same engine version rather than whatever the OS ships.
rusqlite = { version = "=0.40.1", features = ["bundled"] }

# --- wasm32 bindings ---
wasm-bindgen = "=0.2.126"
wasm-bindgen-test = "=0.3.76"
js-sys = "=0.3.103"
serde-wasm-bindgen = "=0.6.5"
console_error_panic_hook = "=0.1.7"
getrandom = "=0.4.3"

# --- relay ---
axum = "=0.8.9"
tokio = { version = "=1.53.1", features = ["full"] }
tower-http = { version = "=0.7.0", features = ["trace", "cors"] }
tracing = "=0.1.41"
tracing-subscriber = { version = "=0.3.20", features = ["env-filter"] }

# --- tauri shell ---
tauri = "=2.11.5"
tauri-build = "=2.6.3"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
