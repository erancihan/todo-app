[package]
name = "daybook-wasm-spike"
version = "0.0.0"
edition = "2021"
publish = false
description = "Phase 0 throwaway: exposes a slice of daybook-core to the browser over wasm-bindgen."

# Deliberately NOT a workspace member — this is throwaway spike code and must not
# become a build dependency of the shipped crates.

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
daybook-core = { path = "../../../crates/core" }
wasm-bindgen = "=0.2.126"
serde = { version = "=1.0.229", features = ["derive"] }
serde-wasm-bindgen = "=0.6.5"
console_error_panic_hook = "=0.1.7"

[dev-dependencies]
wasm-bindgen-test = "=0.3.76"

[profile.release]
opt-level = "s"
lto = true
