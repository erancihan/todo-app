<!doctype html>
<!-- Dark is the shipped default: `.dark` is on <html> from the first paint, so the
     app never flashes light before a script runs (docs/04-ux-and-interaction.md §7). -->
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <title>Daybook</title>
    <link rel="stylesheet" href="/src/app.css" />
  </head>
  <body class="min-h-screen">
    <main id="app" x-data="daybook" class="mx-auto max-w-3xl px-6 py-8">
      <header class="mb-5 flex items-baseline justify-between">
        <h1 class="text-[1.375rem] font-[590] tracking-[-0.02em]">Daybook</h1>
        <span class="font-mono text-[0.6875rem] text-muted-foreground" x-text="runtime"></span>
      </header>

      <!-- Errors surface here rather than being swallowed into the console. -->
      <div
        x-show="state.error"
        x-cloak
        class="mb-4 rounded-[var(--radius)] border px-3 py-2 text-[0.8125rem]"
        style="border-color: var(--destructive); color: var(--destructive)"
        x-text="state.error"
      ></div>

      <!-- `/` search. Shown only once used, so it costs no space when idle. -->
      <div x-show="state.searchOpen || state.query" x-cloak class="mb-3">
        <input
          data-search
          type="text"
          placeholder="Filter todos…"
          :value="state.query"
          x-init="$watch('state.searchOpen', open => open && $nextTick(() => $el.focus()))"
          class="w-full rounded-[var(--radius)] border bg-transparent px-3 py-1.5 text-[0.8125rem] outline-none"
          style="border-color: var(--border)"
          @input="onQuery($event.target.value)"
        />
      </div>

      <!-- The list. `tabindex` so it can hold focus in LIST mode; the keydown
           listener is global, registered by the controller. -->
      <ul data-list tabindex="0" class="outline-none" role="tree" aria-label="Todos">
        <template x-for="node in rows()" :key="node.id">
          <li
            role="treeitem"
            :aria-selected="isFocused(node.id)"
            :style="`margin-left: ${node.depth * 20}px`"
            class="rounded-[var(--radius-sm)]"
            :class="isFocused(node.id) ? 'bg-muted shadow-[inset_2px_0_0_var(--primary)]' : ''"
          >
            <div class="row-dense flex items-start gap-1.5" @click="onRowClick(node.id, $event)">
              <!-- Disclosure chevron. Keeps its slot on leaves so titles stay
                   aligned down the column. -->
              <button
                type="button"
                class="mt-[2px] shrink-0 text-muted-foreground"
                :class="node.hasChildren ? 'hover:text-foreground' : 'invisible'"
                :aria-label="node.collapsed ? 'Expand' : 'Collapse'"
                @click="toggleCollapse(node, $event)"
              >
                <svg
                  viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                  stroke-linecap="round" stroke-linejoin="round"
                  class="size-[12px] transition-transform duration-[120ms]"
                  :style="node.collapsed ? '' : 'transform: rotate(90deg)'"
                ><path d="m9 18 6-6-6-6" /></svg>
              </button>

              <button
                type="button"
                class="mt-[3px] size-[14px] shrink-0 rounded-[3px] border"
                :style="node.status === 'done'
                  ? 'background: var(--success); border-color: var(--success)'
                  : 'border-color: color-mix(in oklch, var(--muted-foreground) 55%, transparent)'"
                :aria-label="node.status === 'done' ? 'Mark not done' : 'Mark done'"
                @click="toggleDone(node, $event)"
              ></button>

              <div class="min-w-0 flex-1">
                <div class="flex items-center gap-2">
                  <!-- Status dot for the states a checkbox cannot express.
                       `todo` and `done` are already the checkbox, so they get no
                       dot — otherwise every row carries redundant chrome. -->
                  <span
                    x-show="statusDot(node)"
                    x-cloak
                    class="size-[6px] shrink-0 rounded-full"
                    :style="`background: ${statusDot(node)?.color}`"
                    :title="statusDot(node)?.label"
                  ></span>

                  <!-- `title` is derived from the body's first line by the engine,
                       with the markdown stripped — never rendered raw here. -->
                  <span
                    class="truncate text-[0.8125rem]"
                    :class="node.status === 'done'
                      ? 'line-through opacity-55'
                      : (node.title ? '' : 'text-muted-foreground italic')"
                    x-text="node.title || 'Untitled'"
                  ></span>

                  <!-- A promoted sub-item keeps its place but gains a marker. -->
                  <span
                    x-show="node.promoted && node.parentId"
                    x-cloak
                    class="font-mono text-[0.625rem] text-muted-foreground"
                    title="Promoted to a full todo"
                    >↑</span
                  >

                  <template x-for="tag in node.tags" :key="tag.id">
                    <span
                      class="rounded-full px-1.5 py-px text-[0.6875rem]"
                      :class="`tag-${tag.color}`"
                      x-text="`#${tag.name}`"
                    ></span>
                  </template>

                  <!-- Everything from here right is meta: pushed to the far edge
                       so the title column stays scannable. -->
                  <span class="ml-auto flex shrink-0 items-center gap-2">
                    <!-- Collection dots: an item can be in several, so this is a
                         row of dots rather than one badge. -->
                    <span class="flex gap-[3px]" x-show="node.collectionIds.length" x-cloak>
                      <template x-for="cid in node.collectionIds" :key="cid">
                        <span
                          class="size-[6px] rounded-full"
                          style="background: var(--primary); opacity: 0.75"
                          :title="collectionName(cid)"
                        ></span>
                      </template>
                    </span>

                    <!-- Sub-item rollup: done / total, only where there are children. -->
                    <span
                      x-show="node.hasChildren"
                      x-cloak
                      class="font-mono text-[0.625rem] text-muted-foreground"
                      x-text="childCount(node)"
                    ></span>
                  </span>
                </div>

                <!-- The editor mounts here when this row is being edited. -->
                <div x-show="isEditing(node.id)" x-cloak :data-editor-slot="node.id"></div>

                <!-- The body beyond the title line, as a one-line preview. -->
                <p
                  x-show="!isEditing(node.id) && preview(node)"
                  x-cloak
                  class="truncate text-[0.75rem] text-muted-foreground"
                  x-text="preview(node)"
                ></p>
              </div>
            </div>
          </li>
        </template>
      </ul>

      <p
        x-show="rows().length === 0"
        x-cloak
        class="row-dense text-[0.8125rem] text-muted-foreground"
      >
        Nothing yet. Press <kbd class="font-mono">n</kbd> to capture something.
      </p>

      <footer class="mt-6 text-[0.6875rem] text-muted-foreground">
        <kbd class="font-mono">?</kbd> cheat sheet ·
        <kbd class="font-mono">Ctrl/Cmd+K</kbd> palette ·
        <kbd class="font-mono">Ctrl/Cmd+Enter</kbd> submit
      </footer>

      <!-- Mode pill: vim-style modality, but legible (docs §3). -->
      <div
        data-mode-pill
        class="fixed bottom-4 right-4 rounded-full border px-2.5 py-1 font-mono text-[0.625rem] tracking-[0.08em]"
        style="border-color: var(--border); background: var(--card)"
        :style="state.mode === 'edit' ? 'color: var(--primary)' : ''"
        aria-live="polite"
        x-text="state.pendingKey ? state.pendingKey + '…' : state.mode.toUpperCase()"
      ></div>

      <!-- `t` tag editor. Axis 2: flat, cross-cutting labels. -->
      <div
        x-show="state.tagEditorOpen"
        x-cloak
        class="fixed inset-0 z-50 flex items-start justify-center p-6 pt-[20vh]"
        style="background: rgb(0 0 0 / 0.55)"
        @click="closeOverlays(); tagDraft = ''"
      >
        <div
          class="w-full max-w-md rounded-[var(--radius-lg)] border p-4"
          style="border-color: var(--border); background: var(--popover)"
          @click.stop
        >
          <h2 class="mb-2 text-[0.8125rem] font-[560]">
            Tags for <span class="text-muted-foreground" x-text="focused?.title || 'Untitled'"></span>
          </h2>

          <!-- Current tags, each removable. -->
          <div class="mb-3 flex flex-wrap gap-1.5" x-show="focused?.tags.length">
            <template x-for="tag in focused?.tags ?? []" :key="tag.id">
              <button
                type="button"
                class="rounded-full px-2 py-0.5 text-[0.6875rem]"
                :class="`tag-${tag.color}`"
                @click="dropTag(tag.id)"
                :title="`Remove #${tag.name}`"
                x-text="`#${tag.name} ×`"
              ></button>
            </template>
          </div>

          <input
            x-model="tagDraft"
            x-init="$watch('state.tagEditorOpen', open => open && $nextTick(() => $el.focus()))"
            type="text"
            placeholder="Add a tag, Enter to apply…"
            class="w-full rounded-[var(--radius)] border bg-transparent px-2.5 py-1.5 text-[0.8125rem] outline-none"
            style="border-color: var(--border)"
            @keydown.enter.prevent="submitTag()"
            @keydown.escape.prevent="closeOverlays(); tagDraft = ''"
          />

          <!-- Existing tags in the account, so the vocabulary stays small. -->
          <div class="mt-3 flex flex-wrap gap-1.5" x-show="state.allTags.length">
            <template x-for="tag in state.allTags" :key="tag.id">
              <button
                type="button"
                class="rounded-full px-2 py-0.5 text-[0.6875rem] opacity-70 hover:opacity-100"
                :class="`tag-${tag.color}`"
                @click="tagDraft = tag.name; submitTag()"
                x-text="`#${tag.name}`"
              ></button>
            </template>
          </div>
        </div>
      </div>

      <!-- `c` collections picker. Axis 1: many-to-many, so this is multi-select. -->
      <div
        x-show="state.collectionPickerOpen"
        x-cloak
        class="fixed inset-0 z-50 flex items-start justify-center p-6 pt-[20vh]"
        style="background: rgb(0 0 0 / 0.55)"
        @click="closeOverlays(); collectionDraft = ''"
      >
        <div
          class="w-full max-w-md rounded-[var(--radius-lg)] border p-4"
          style="border-color: var(--border); background: var(--popover)"
          @click.stop
        >
          <h2 class="mb-1 text-[0.8125rem] font-[560]">
            Collections for
            <span class="text-muted-foreground" x-text="focused?.title || 'Untitled'"></span>
          </h2>
          <p class="mb-3 text-[0.6875rem] text-muted-foreground">
            An item can live in several at once.
          </p>

          <ul class="mb-3 max-h-60 overflow-y-auto" x-show="state.allCollections.length">
            <template x-for="col in state.allCollections" :key="col.id">
              <li>
                <button
                  type="button"
                  class="flex w-full items-center gap-2 rounded-[var(--radius-sm)] px-2 py-1.5 text-left text-[0.8125rem] hover:bg-muted"
                  @click="toggleCollection(col.id)"
                >
                  <span
                    class="size-[13px] shrink-0 rounded-[3px] border"
                    :style="inCollection(col.id)
                      ? 'background: var(--primary); border-color: var(--primary)'
                      : 'border-color: var(--border)'"
                  ></span>
                  <span x-text="col.name"></span>
                  <span
                    class="ml-auto font-mono text-[0.625rem] text-muted-foreground"
                    x-text="col.nodeCount"
                  ></span>
                </button>
              </li>
            </template>
          </ul>

          <input
            x-model="collectionDraft"
            x-init="$watch('state.collectionPickerOpen', open => open && $nextTick(() => $el.focus()))"
            type="text"
            placeholder="New collection, Enter to create…"
            class="w-full rounded-[var(--radius)] border bg-transparent px-2.5 py-1.5 text-[0.8125rem] outline-none"
            style="border-color: var(--border)"
            @keydown.enter.prevent="submitCollection()"
            @keydown.escape.prevent="closeOverlays(); collectionDraft = ''"
          />
        </div>
      </div>

      <!-- `?` cheat sheet -->
      <div
        x-show="state.cheatSheetOpen"
        x-cloak
        class="fixed inset-0 z-40 flex items-center justify-center p-6"
        style="background: rgb(0 0 0 / 0.55)"
        @click="state.cheatSheetOpen = false"
      >
        <div
          class="max-h-[80vh] w-full max-w-2xl overflow-y-auto rounded-[var(--radius-lg)] border p-5"
          style="border-color: var(--border); background: var(--popover)"
          @click.stop
        >
          <h2 class="mb-3 text-[0.9375rem] font-[560]">Keyboard</h2>
          <div class="grid gap-5 sm:grid-cols-3">
            <template x-for="section in cheatSheet" :key="section.title">
              <div>
                <h3
                  class="mb-1.5 text-[0.6875rem] uppercase tracking-wide text-muted-foreground"
                  x-text="section.title"
                ></h3>
                <template x-for="row in section.rows" :key="row.keys">
                  <div class="flex justify-between gap-3 py-0.5 text-[0.75rem]">
                    <span class="font-mono text-muted-foreground" x-text="row.keys"></span>
                    <span class="text-right" x-text="row.action"></span>
                  </div>
                </template>
              </div>
            </template>
          </div>
        </div>
      </div>

      <!-- Ctrl/Cmd+K palette -->
      <div
        x-show="state.paletteOpen"
        x-cloak
        class="fixed inset-0 z-50 flex items-start justify-center p-6 pt-[15vh]"
        style="background: rgb(0 0 0 / 0.55)"
        @click="state.paletteOpen = false; paletteQuery = ''"
      >
        <div
          class="w-full max-w-lg overflow-hidden rounded-[var(--radius-lg)] border"
          style="border-color: var(--border); background: var(--popover)"
          @click.stop
        >
          <input
            x-model="paletteQuery"
            x-init="$watch('state.paletteOpen', open => open && $nextTick(() => $el.focus()))"
            type="text"
            placeholder="Type a command…"
            class="w-full border-b bg-transparent px-3 py-2.5 text-[0.875rem] outline-none"
            style="border-color: var(--border)"
            @keydown.escape="state.paletteOpen = false; paletteQuery = ''"
            @keydown.enter="paletteResults()[0] && runCommand(paletteResults()[0].id)"
          />
          <ul class="max-h-80 overflow-y-auto py-1">
            <template x-for="cmd in paletteResults()" :key="cmd.id">
              <li>
                <button
                  type="button"
                  class="flex w-full items-center justify-between px-3 py-1.5 text-left text-[0.8125rem] hover:bg-muted"
                  @click="runCommand(cmd.id)"
                >
                  <span x-text="cmd.label"></span>
                  <span
                    class="font-mono text-[0.6875rem] text-muted-foreground"
                    x-text="cmd.keys.join(' / ')"
                  ></span>
                </button>
              </li>
            </template>
            <li
              x-show="paletteResults().length === 0"
              class="px-3 py-2 text-[0.8125rem] text-muted-foreground"
            >
              No matching command.
            </li>
          </ul>
        </div>
      </div>
    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
